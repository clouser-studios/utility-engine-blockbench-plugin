# Most descriptions support Markdown formatting.
#

global:
  confirm: Confirm
  cancel: Cancel

texture:
  skin: Skin Texture

action:
  create_skin_texture.label: Create Skin Texture
  export_utility_model.label: Export Utility Model
  export_utility_model_as.label: Export Utility Model As
  import_utility_model.label: Import Utility Model
  delete_animation_folder.label: Delete Animation Folder
  open_utility_model_settings.label: Project Settings
  skin_model_preview_toggle:
    label: Skin Model Preview
    description: Show only elements marked for the wide or slim skin model in the viewport.

menu:
  skin_texture:
    change_preview_skin:
      label: Change Preview Skin
      from_file: From File
      from_username: From Username

    remove_preview_skin: Remove Preview Skin

timeline:
  commands: Function

panel:
  function_keyframe:
    commands:
      label: Commands
      description: Commands to run when this keyframe is reached, one per line.
    condition:
      label: Condition
      description: An execute subcommand chain the commands only run under, e.g. "if score @s x matches 1..".
  overrides:
    label: Display Override
    description: |-
      A reference to another model to use for this display slot instead.
    placeholder: namespace:path/to/model
    pick_file: Pick a model file and use its resource location
    not_in_resource_pack: The selected file is not inside a valid resource pack.

  arm_rotation:
    title: Arm Rotation
    description: |-
      Customize the arm rotations for when the player is holding this item in either hand.

    left_arm:
      label: Left Arm

    right_arm:
      label: Right Arm

    when_offhand_occupied:
      title: Arm Rotation when Offhand Occupied
      description: |-
        Customize the arm rotations for when the player is holding this item, and has an item in their other hand.

    warning:
      non_player_ref_model: |-
        [Markdown]
        Please set the reference model to 'Player' in order to preview custom arm rotations.

      no_open_project: |-
        [Markdown]
        No project is currently open.

        If you're seeing this, something has gone horribly wrong.

dialog:
  reset: Reset

  username_prompt:
    username.label: Enter a Minecraft Username
    username.placeholder: Enter a Minecraft username

  animation_properties:
    title: Animation Properties (%s)

    animation_type:
      label: Animation Type
      description: The type of animation.
      options:
        custom: Custom
        being_worn_loop: Being Worn Loop
        being_worn_reset: Being Worn Reset
        charging_loop: Charging Loop
        charging_reset: Charging Reset
        consume_cancel: Consume Cancel
        consume_loop: Consume Loop
        consume_reset: Consume Reset
        held_loop: Held Loop
        held_reset: Held Reset
        held_stop: Held Stop
        left_click: Left Click
        main_loop: Main Loop
        not_held_loop: Not Held Loop
        picked_up: Picked Up
        placed_breaking_loop: Placed Breaking Loop
        placed_breaking_reset: Placed Breaking Reset
        placed_breaking_stop: Placed Breaking Stop
        placed_broken: Placed Broken
        placed_falling_reset: Placed Falling Reset
        placed_falling: Placed Falling
        placed_loop: Placed Loop
        placed_reset: Placed Reset
        placed_use_loop: Placed Use Loop
        placed_use_reset: Placed Use Reset
        placed_use_stop: Placed Use Stop
        placed_walked_on_loop: Placed Walked On Loop
        placed_walked_on_reset: Placed Walked On Reset
        right_click: Right Click
        selected_reset: Selected Reset
        swimming_loop: Swimming Loop
        swimming_reset: Swimming Reset
        swimming_stop: Swimming Stop
        used: Used

    animation_name:
      label: Animation Name
      description: The name of the animation.
      placeholder: Enter an animation name

    loop_mode:
      label: Loop Mode
      description: |-
        The loop mode of the animation.
        _ Once: The animation will play once, then reset to the first frame.
        _ Hold on Last Frame: The animation will play once, and stop on the last frame.
        _ Loop: The animation will loop indefinitely.
      options:
        once: Once
        hold: Hold on Last Frame
        loop: Loop

    loop_delay:
      label: Loop Delay
      description: The loop delay of the animation.

element_properties:
  skin_model:
    label: Skin Model
    description: Which player skin model this element is rendered for.
    options:
      all: All
      wide: Wide Only
      slim: Slim Only
  render_passes:
    label: Render Passes
    description: Custom render passes to apply to this element.
    add: Add render pass
    remove: Remove render pass
    placeholder: Pass ID

model_format:
  utility_model:
    name: Utility Model
    description: The basic model format for Utility Engine.
    format_page: |-
      [Markdown]
      ### Getting Started

      Check out the [Utility Engine Docs](https://www.utility-engine.com) for more information on how to use this model format.
    format_page_start_button: Create new Utility Model
    project_settings:
      model_identifier: Model Identifier
      default_backface_culling_mode:
        title: Default Backface Culling Mode
        options:
          no_culling: No Culling
          cull_backfaces: Cull Backfaces

    element_settings:
      use_default_backface_culling: Use Default Backface Culling
      backface_culling: Backface Culling

model_loader:
  utility_model_json_loader:
    name: Import .utility.json
    description: Import a Utility Model from a .utility.json file.
    format_page: |-
      [Markdown]
      ### Importing a .utility.json File

      This will import a Utility Model from a .utility.json file, which is the model format used by Utility Engine.

      ### Please note
      This may not import textures, as .utility.json files do not contain texture data.

      It is recommended to save all of your Utility Model Projects as .utilityproject files to ensure that all data is preserved for future editing.
    format_page_start_button: Import .utility.json

format_category:
  utility_engine: Utility Engine

message:
  failed_to_export:
    title: Failed to Export
    message: |-
      An error occurred while exporting the model.
      Error: %s

  exported: Successfully exported!

export:
  error:
    texture_not_saved: The texture "%s" is not saved to disk!
    texture_not_found: 'A mesh face references a texture that could not be found (UUID: %s).'
    invalid_resource_pack_path:
      description: |-
        [Markdown]
        Texture "%s" is not saved inside of a valid resource pack!

        In order for Utility Engine to use this texture, it must be saved inside of a resource pack.

        Please save the texture to a valid resource pack before exporting for use in Utility Engine.

        Texture Save Path: `%s`

error:
  utility_model_format:
    failed_to_upgrade_project:
      title: Failed to Upgrade Project!
      description: |-
        [Markdown]
        An unexpected error occurred while upgrading the project:

        ```
        %s
        ```

        Your model may be corrupted! Continue editing at your own risk!

    failed_to_export_project.title: Failed to export the project.
    failed_to_export_project.description: |-
      [Markdown]
      An unexpected error occurred while exporting the project:

      ```
      %s
      ```

    invalid_export_path: The export path is invalid!
