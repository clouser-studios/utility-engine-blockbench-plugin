    build-and-test:
        name: 🏗️ Build & Test
        runs-on: ubuntu-latest
        needs: prettier

        steps:
            - uses: actions/checkout@v3

            - name: Set Node.js 17.x
              uses: actions/setup-node@v3
              with:
                  node-version: 17.x

            - name: Clean node_modules
              run: rm -rf node_modules

            - name: Run install
              uses: borales/actions-yarn@v4
              with:
                  cmd: install --frozen-lockfile

            #   env:
