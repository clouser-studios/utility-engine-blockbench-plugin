name: Build & Test PR
description: Run ESLint on the codebase to ensure code quality, and consistency. Then build & test the plugin.
on:
    # Trigger the workflow on push or pull request,
    # but only for the main branch
    push:
        branches:
            - main
    # Replace pull_request with pull_request_target if you
    # plan to use this action with forks, see the Limitations section
    pull_request:
        types:
            - opened
            - synchronize
        branches:
            - main

concurrency:
    group: pr-tests-${{ github.ref }}

permissions:
    contents: read

jobs:
    prettier:
        name: 🎨 Inspect Code Formatting
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: read
            # To report GitHub Actions status checks
            statuses: write

        steps:
            - name: Checkout
              uses: actions/checkout@v3
              with:
                  # Make sure the actual branch is checked out when running on pull requests
                  ref: ${{ github.head_ref }}

            - name: Set Node.js 17.x
              uses: actions/setup-node@v3
              with:
                  node-version: 17.x

            - name: Run install
              uses: borales/actions-yarn@v4
              with:
                  cmd: install --frozen-lockfile

            - name: Validate formatting
              uses: creyD/prettier_action@v4.3
              with:
                  # dry: true
                  only_changed: true
                  prettier_options: --config-precedence=file-override --write .
                  commit_message: 🎨 Prettify code
                  same_commit: true

